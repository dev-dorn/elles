services:
  # --- DATABASES ---
  postgres-order:
    image: postgres:15-alpine
    container_name: postgres_order
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: order_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-inventory:
    image: postgres:15-alpine
    container_name: postgres_inventory
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: inventory_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-identity:
    image: postgres:15-alpine
    container_name: postgres_identity
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: identity_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_identity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-payment:
    image: postgres:15-alpine
    container_name: postgres_payment
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: payment_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval ''db.runCommand({ping: 1}).ok'''
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - localstack_data:/var/lib/localstack

  # --- SERVICES ---
  catalog-service:
    build: ../backend/catalog-service
    ports:
      - "8001:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENVIRONMENT: local
      MONGO_URL: mongodb://admin:admin@mongodb:27017/?authSource=admin
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/
      AWS_ENDPOINT_URL: http://localstack:4566
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  order-service:
    build: ../backend/order-service
    ports:
      - "8002:8000"
    environment:
      ENVIRONMENT: local
      POSTGRES_URL: postgresql+asyncpg://admin:admin@postgres-order:5432/order_db
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/
      AWS_ENDPOINT_URL: http://localstack:4566
    depends_on:
      postgres-order:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  inventory-service:
    build: ../backend/inventory-service
    ports:
      - "8003:8000"
    environment:
      ENVIRONMENT: local
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      POSTGRES_URL: postgresql+asyncpg://admin:admin@postgres-inventory:5432/inventory_db
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/
      AWS_ENDPOINT_URL: http://localstack:4566
    depends_on:
      postgres-inventory:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  identity-service:
    build: ../backend/identity-service
    ports:
      - "8004:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENVIRONMENT: local
      POSTGRES_URL: postgresql+asyncpg://admin:admin@postgres-identity:5432/identity_db
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/
      AWS_ENDPOINT_URL: http://localstack:4566
    depends_on:
      postgres-identity:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-service:
    build: ../backend/payment-service
    ports:
      - "8005:8000"
    environment:
      ENVIRONMENT: local
      POSTGRES_URL: postgresql+asyncpg://admin:admin@postgres-payment:5432/payment_db
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/
      AWS_ENDPOINT_URL: http://localstack:4566
    depends_on:
      postgres-payment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build: ../backend/notification-service
    ports:
      - "8006:8000"
    environment:
      ENVIRONMENT: local
      MONGO_URI: mongodb://admin:admin@mongodb:27017/?authSource=admin
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/
      AWS_ENDPOINT_URL: http://localstack:4566
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_order_data:
  postgres_inventory_data:
  postgres_identity_data:
  postgres_payment_data:
  mongo_data:
  rabbitmq_data:
  localstack_data: